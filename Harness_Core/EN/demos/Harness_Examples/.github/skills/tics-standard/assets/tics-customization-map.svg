<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960" role="img" aria-labelledby="title desc">
  <title id="title">TICS Agent Customization Map</title>
  <desc id="desc">Diagram showing how instructions, skills, references, prompts, and assets work together in the repository-level TICS Copilot customization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #1a202c; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #4a5568; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #1a202c; }
      .path { font: 700 17px 'Consolas', 'Courier New', monospace; fill: #1f2937; }
      .body { font: 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .legend { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .card { stroke: #cbd5e0; stroke-width: 1.5; rx: 20; ry: 20; }
      .line { stroke: #4a5568; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="960" fill="url(#bg)"/>

  <text x="80" y="80" class="title">TICS Agent Customization Map</text>
  <text x="80" y="112" class="subtitle">How the repository-level Copilot customization is organized for TICS-ready C# delivery</text>

  <rect x="80" y="160" width="1320" height="90" class="card" fill="#ffffff"/>
  <text x="110" y="205" class="section">Repository Root</text>
  <text x="110" y="232" class="path">.github/</text>
  <text x="360" y="205" class="body">This is the shared entry point that all employees get when they open the repository as a workspace.</text>
  <text x="360" y="232" class="body">Instructions drive automatic behavior. Skills, prompts, references, and assets support specific workflows.</text>

  <rect x="80" y="320" width="360" height="220" class="card" fill="#e8f1ff"/>
  <text x="110" y="360" class="section">Automatic Guidance</text>
  <text x="110" y="392" class="path">.github/instructions/tics-csharp.instructions.md</text>
  <text x="110" y="428" class="body">Auto-loaded for matching files:</text>
  <text x="128" y="455" class="body">- Applies to C# edits through applyTo</text>
  <text x="128" y="482" class="body">- Holds short, stable generation constraints</text>
  <text x="128" y="509" class="body">- Best place for always-on team coding rules</text>

  <rect x="560" y="320" width="360" height="220" class="card" fill="#e7fff3"/>
  <text x="590" y="360" class="section">On-Demand Workflow</text>
  <text x="590" y="392" class="path">.github/skills/tics-standard/SKILL.md</text>
  <text x="590" y="428" class="body">User- or model-invoked when TICS work is needed:</text>
  <text x="608" y="455" class="body">- Review and fix TICS findings</text>
  <text x="608" y="482" class="body">- Apply the repository TICS workflow</text>
  <text x="608" y="509" class="body">- Pull in references and assets as needed</text>

  <rect x="1040" y="320" width="360" height="220" class="card" fill="#fff4e6"/>
  <text x="1070" y="360" class="section">Manual Self-Check</text>
  <text x="1070" y="392" class="path">.github/prompts/tics-preflight.prompt.md</text>
  <text x="1070" y="428" class="body">Run before handoff or commit:</text>
  <text x="1088" y="455" class="body">- Reviews current changed C# files</text>
  <text x="1088" y="482" class="body">- Reports findings before edits</text>
  <text x="1088" y="509" class="body">- Good for delivery preflight checks</text>

  <rect x="320" y="620" width="420" height="220" class="card" fill="#ffffff"/>
  <text x="350" y="660" class="section">Detailed Knowledge</text>
  <text x="350" y="692" class="path">.github/skills/tics-standard/references/*.md</text>
  <text x="350" y="728" class="body">Keep long and detailed content here:</text>
  <text x="368" y="755" class="body">- common-rules.md</text>
  <text x="368" y="782" class="body">- philips-csharp-checked-level1-7.md</text>
  <text x="368" y="809" class="body">- which-file-to-edit.md</text>

  <rect x="840" y="620" width="420" height="220" class="card" fill="#ffffff"/>
  <text x="870" y="660" class="section">Shareable Assets</text>
  <text x="870" y="692" class="path">.github/skills/tics-standard/assets/*</text>
  <text x="870" y="728" class="body">Reusable communication materials:</text>
  <text x="888" y="755" class="body">- SVG diagrams</text>
  <text x="888" y="782" class="body">- Visual onboarding aids</text>
  <text x="888" y="809" class="body">- Internal sharing materials</text>

  <path d="M740 250 L740 300" class="line"/>
  <path d="M260 250 L260 300" class="line"/>
  <path d="M1220 250 L1220 300" class="line"/>
  <path d="M740 540 L740 590 L530 590 L530 620" class="line"/>
  <path d="M740 540 L740 590 L1050 590 L1050 620" class="line"/>

  <rect x="80" y="880" width="180" height="34" rx="10" ry="10" fill="#e8f1ff" stroke="#cbd5e0"/>
  <text x="103" y="902" class="legend">Automatic</text>
  <rect x="300" y="880" width="180" height="34" rx="10" ry="10" fill="#e7fff3" stroke="#cbd5e0"/>
  <text x="323" y="902" class="legend">On-Demand</text>
  <rect x="520" y="880" width="180" height="34" rx="10" ry="10" fill="#fff4e6" stroke="#cbd5e0"/>
  <text x="543" y="902" class="legend">Manual Preflight</text>
  <rect x="740" y="880" width="200" height="34" rx="10" ry="10" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="763" y="902" class="legend">Reference and Assets</text>

  <text x="990" y="902" class="small">Recommended sharing message: instructions are the default guardrails, the skill is the repair workflow, the prompt is the pre-delivery check.</text>
</svg>